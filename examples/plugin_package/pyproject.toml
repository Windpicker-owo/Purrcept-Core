[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "purrcept-demo-plugin"
version = "0.5.0"
description = "A minimal external extension package for purrcept_core."
requires-python = ">=3.11"
dependencies = ["purrcept_core>=0.5.0,<0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/purrcept_demo_plugin"]
